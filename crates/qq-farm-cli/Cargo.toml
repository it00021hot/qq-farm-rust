[package]
name = "qq-farm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "qq-farm-rust 命令行工具（包含 demo / 调试 / 运维命令）"

[lints]
workspace = true

[[bin]]
name = "qq-farm"
path = "src/main.rs"

[dependencies]
qq-farm-core = { workspace = true }

# 异步运行时（demo 用）
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls-vendored"] }

# 错误处理
anyhow = { workspace = true }

# 日志
tracing = { workspace = true }

# CLI
clap = { workspace = true }

# 工具
hex = { workspace = true }
futures = { workspace = true }
