[package]
name = "qq-farm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "QQ 农场 Tauri v2 桌面端"

[[bin]]
name = "qq-farm-desktop"
path = "src/main.rs"

[lib]
name = "qq_farm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qq-farm-app = { workspace = true }
qq-farm-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# 仅启用本机微信所需的 TLS、自定义 Origin 和自签证书支持。
tauri-plugin-http = { version = "2.6", default-features = false, features = ["rustls-tls", "unsafe-headers", "dangerous-settings"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
dirs = "7"
tauri-plugin-opener = "2.5.5"

[lints]
workspace = true

[features]
default = []
