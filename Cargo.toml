[workspace]
resolver = "2"
members = [
    "crates/qq-farm-core",
    "crates/qq-farm-app",
    "crates/qq-farm-desktop",
]

[workspace.package]
version = "0.2.8"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Milo"]
repository = "https://github.com/it00021hot/qq-farm-rust"
description = "QQ 农场多账号挂机 — Rust 重写版"
readme = "README.md"
keywords = ["qq-farm", "automation", "tauri", "rust"]
categories = ["games", "gui"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# 默认保持稳定的 Clippy 检查；风格型、实验型和依赖图检查按需单独启用。
# 这些扩展组不适合作为全仓零警告基线：它们会把协议字段命名、数值转换和
# Tauri 的传值式命令签名等有意设计报告为数千条警告。
all = { level = "warn", priority = -2 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
# 以下 pedantic 项暂时放过，避免误报过多
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
redundant_pub_crate = "allow"
# 命名风格统一
missing_const_for_fn = "allow"

# ===== 共享依赖版本 =====
[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# 异步 traits
async-trait = "0.1"
futures = "0.3"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "1.1"

# 时间
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# 配置
config = { version = "0.15", default-features = false, features = ["toml"] }

# HTTP / Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs"] }
hyper = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }

# WebSocket / Socket.IO（对齐原 bot `/socket.io`，给 Vue 前端用）
socketioxide = "0.18"

# Protobuf
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"

# WASM：TSDK 只使用传统 Wasm 模块 + Cranelift，同步调用和编译缓存。
# 关闭组件模型、GC、profiling、coredump、WAT 等未使用能力，减少桌面端链接体积。
wasmtime = { version = "48", default-features = false, features = ["anyhow", "cache", "cranelift", "runtime"] }

# 工具
hex = "0.4"
base64 = "0.23"
bytes = "1"
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
url = "2"
dotenvy = "0.15"

# 加密 / 哈希
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# AES-GCM
aes = "0.9"
aes-gcm = "0.11"
# LZ4 压缩（wx-login 协议）
lz4_flex = "0.14"
# ECDH P-256（wx-login 协议）
p256 = { version = "0.14", features = ["ecdh"] }

# Desktop UI (Tauri v2) — versions pinned in qq-farm-desktop Cargo.toml

# 进程内 crate
qq-farm-core = { path = "crates/qq-farm-core" }
qq-farm-app = { path = "crates/qq-farm-app" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# 发布包不携带调试/链接符号；后台 task panic 仍需 unwind 才能被 Tokio 隔离
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

# debug 下手写/纯 Rust 密码学极慢；登录 PBKDF2 与 TSDK 编译走优化
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
