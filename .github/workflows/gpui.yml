name: GPUI desktop

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/qq-farm-app/**"
      - "crates/qq-farm-core/**"
      - "crates/qq-farm-gpui/**"
      - "assets/game_config/**"
      - "assets/tsdk*.wasm"
      - "desktop-ui/public/activity-assets/**"
      - "desktop-ui/public/land-assets/**"
      - "scripts/package-gpui.*"
      - ".github/workflows/gpui.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/qq-farm-app/**"
      - "crates/qq-farm-core/**"
      - "crates/qq-farm-gpui/**"
      - "assets/game_config/**"
      - "assets/tsdk*.wasm"
      - "desktop-ui/public/activity-assets/**"
      - "desktop-ui/public/land-assets/**"
      - "scripts/package-gpui.*"
      - ".github/workflows/gpui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-aarch64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-x86_64
          - name: Windows x86_64
            runner: windows-latest
            artifact: windows-x86_64
          - name: Linux x86_64
            runner: ubuntu-latest
            artifact: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --no-deps -p qq-farm-gpui --all-targets -- -D warnings

      - name: Test app and GPUI UI
        run: |
          cargo test -p qq-farm-app
          cargo test -p qq-farm-gpui

      - name: Build release client
        run: cargo build --release -p qq-farm-gpui

      - name: Package desktop client
        # GPUI 暂不打包（用户决策 2026-10-17）。
        if: false
        run: bash scripts/package-gpui.sh release

      - name: Package desktop client (Windows)
        if: false
        shell: pwsh
        run: ./scripts/package-gpui.ps1 release

      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: qq-farm-gpui-${{ matrix.artifact }}
          path: dist/qq-farm-gpui-*
          if-no-files-found: error

  frontend:
    name: Vue checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop-ui/pnpm-lock.yaml
      - run: pnpm -C desktop-ui install --frozen-lockfile
      - run: pnpm -C desktop-ui typecheck
      - run: pnpm -C desktop-ui build
